# Example for the existing domain. Adapt certificate paths before installation.
# Do not overwrite an existing working TLS/Certbot configuration blindly.
server {
    listen 80;
    server_name saba-dy.ru www.saba-dy.ru;
    return 301 https://saba-dy.ru$request_uri;
}
server {
    listen 443 ssl;
    server_name saba-dy.ru;
    ssl_certificate /etc/letsencrypt/live/saba-dy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saba-dy.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50M;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
server {
    listen 443 ssl;
    server_name www.saba-dy.ru;
    ssl_certificate /etc/letsencrypt/live/saba-dy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saba-dy.ru/privkey.pem;
    return 301 https://saba-dy.ru$request_uri;
}
